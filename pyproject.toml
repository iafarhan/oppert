[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "oppert"
version = "0.1.0"
description = "OpPert: Rotation Operators for Single-Cell Perturbation Response Prediction"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scanpy>=1.9",
    "anndata>=0.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm",
    "h5py",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
include = ["oppert*"]
